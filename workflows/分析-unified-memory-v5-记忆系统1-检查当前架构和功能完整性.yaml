name: "Unified Memory v5 记忆系统诊断分析"
description: "对 Unified Memory v5 记忆系统进行全面的架构分析、功能完整性检查、缺失模块识别，并输出诊断报告和改进计划"

agents_dir: "agency-agents-zh"

llm:
  provider: minimax
  model: MiniMax-M2.7
  max_tokens: 4096
  timeout: 300000
  retry: 2

concurrency: 2

steps:
  - id: analyze_architecture
    role: "engineering/engineering-software-architect"
    name: "架构分析师"
    emoji: "🏗️"
    task: |
      作为资深软件架构师，对 Unified Memory v5 记忆系统进行全面架构分析。

      请检查以下方面：
      1. **整体架构设计**：系统采用什么架构模式（如分层、模块化、微服务等）
      2. **核心组件**：列出系统的主要模块及其职责
      3. **数据流设计**：记忆的存储、检索、更新、删除流程是否清晰合理
      4. **接口设计**：API 是否规范、版本控制是否完善
      5. **扩展性评估**：系统架构是否支持横向扩展和功能扩展
      6. **依赖管理**：外部依赖是否合理，是否有循环依赖风险
      7. **一致性保证**：分布式场景下数据一致性如何保证

      目标系统信息：Unified Memory v5 记忆系统

      输出格式：
